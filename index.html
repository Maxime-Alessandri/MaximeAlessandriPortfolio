<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Dr. Maxime Alessandri, PhD — Scientist &amp; Scientific Software Architect</title>
    <meta name="description" content="Portfolio of Dr. Maxime Alessandri, PhD Neuroscientist &amp; Scientific Software Architect. Featuring custom LIMS (A1–P24 microplate tracking), Tecan Fluent 1080 3D digital twin, 96-to-384 hitpick &amp; dilution mapper, 4PL dose-response &amp; Z'-factor QC, and GWL / SiLA 2 / PostgreSQL pipelines in Qt 6 WebAssembly.">
    <meta property="og:title" content="Dr. Maxime Alessandri, PhD — Scientist &amp; Scientific Software Architect">
    <meta property="og:description" content="Interactive Qt 6 WebAssembly portfolio bridging wet-lab experimental biology, custom LIMS (A1–P24), and Tecan liquid-handling automation.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="sphere.png">

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070B;
        color: #F5F5F7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #screen {
        width: 100%;
        height: 100%;
        display: none;
      }
      #qtspinner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(41, 151, 255, 0.14) 0%, rgba(5, 7, 11, 0) 58%),
          #05070B;
        z-index: 9999;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
      }
      #qtspinner.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .emblem {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(145deg, rgba(41, 151, 255, 0.22), rgba(11, 19, 43, 0.85));
        border: 1px solid rgba(41, 151, 255, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 0 40px rgba(41, 151, 255, 0.25);
        animation: pulse-ring 2.4s infinite ease-in-out;
      }
      @keyframes pulse-ring {
        0%, 100% { transform: scale(1); box-shadow: 0 0 32px rgba(41, 151, 255, 0.22); }
        50% { transform: scale(1.04); box-shadow: 0 0 48px rgba(41, 151, 255, 0.42); }
      }
      .title {
        font-family: "Cormorant Garamond", "Georgia", serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #F5F5F7;
        margin-bottom: 8px;
      }
      .subtitle {
        font-family: "JetBrains Mono", "SF Mono", "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: #2997FF;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .progress-track {
        width: 260px;
        height: 3px;
        border-radius: 2px;
        background-color: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .progress-fill {
        width: 28%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #2997FF, #58A6FF);
        animation: indeterminate-bar 1.6s infinite ease-in-out;
      }
      @keyframes indeterminate-bar {
        0% { transform: translateX(-110%); width: 35%; }
        50% { transform: translateX(90%); width: 45%; }
        100% { transform: translateX(280%); width: 35%; }
      }
      #qtstatus {
        font-family: "JetBrains Mono", "SF Mono", "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: #86868B;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body onload="init()">
    <figure id="qtspinner">
      <div class="emblem" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
          <line x1="3.5" y1="17" x2="24.5" y2="17" stroke="rgba(245,245,247,0.28)" stroke-width="1"/>
          <path d="M 3.5 17 L 7.5 17 C 9.8 17 11.6 11 13 4.8 C 13.6 3.6 14.4 3.6 15 4.8 C 16 11 17 22.8 18.6 22.8 C 20 22.8 21.4 17 24.5 17" stroke="#F5F5F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="4.2" r="1.7" fill="#2997FF"/>
        </svg>
      </div>
      <div class="title">MAXIME ALESSANDRI, PhD</div>
      <div class="subtitle">Scientist &amp; Scientific Software Architect // Lab Systems &amp; Automation</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div id="qtstatus">INITIALIZING WEBASSEMBLY &amp; 3D WORKCELL RUNTIME...</div>
      <noscript>JavaScript and WebAssembly are required to view this interactive portfolio.</noscript>
    </figure>

    <div id="screen"></div>

    <script type="text/javascript">
      async function init() {
        const spinner = document.querySelector('#qtspinner');
        const screen = document.querySelector('#screen');
        const status = document.querySelector('#qtstatus');
        const progressFill = document.querySelector('#progress-fill');

        const showScreen = () => {
          screen.style.display = 'block';
          spinner.classList.add('fade-out');
          setTimeout(() => {
            spinner.style.display = 'none';
          }, 480);
        };

        const showSpinnerError = (msg) => {
          spinner.classList.remove('fade-out');
          spinner.style.display = 'flex';
          screen.style.display = 'none';
          if (progressFill) {
            progressFill.style.animation = 'none';
            progressFill.style.width = '100%';
            progressFill.style.background = '#FF5500';
          }
          status.textContent = msg;
        };

        try {
          status.textContent = 'LOADING QT 6 WORKBENCH & 3D CAD ASSETS...';
          await qtLoad({
            qt: {
              onLoaded: () => showScreen(),
              onExit: (exitData) => {
                let msg = 'RUNTIME EXITED';
                if (exitData && exitData.code !== undefined) msg += ' (CODE ' + exitData.code + ')';
                if (exitData && exitData.text !== undefined) msg += ' — ' + exitData.text;
                showSpinnerError(msg);
              },
              entryFunction: window.MaximeAlessandriPortfolio_entry,
              containerElements: [screen]
            }
          });
        } catch (e) {
          console.error(e);
          showSpinnerError('RUNTIME ERROR: ' + (e && e.message ? e.message : String(e)));
        }
      }
    </script>
    <script src="MaximeAlessandriPortfolio.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
